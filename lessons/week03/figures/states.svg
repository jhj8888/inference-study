<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" role="img" aria-label="主线状态：等待、活动、结束；抢占可以返回等待"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456b84"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="32" y="38" text-anchor="start" fill="#203b52" font-size="25"><tspan x="32" dy="0">主线状态：等待、活动、结束；抢占可以返回等待</tspan></text><rect x="35" y="115" width="240" height="88" rx="12" fill="#e8f0f6" stroke="#b6c9d6"/><text x="155.0" y="145" text-anchor="middle" fill="#203b52" font-size="17"><tspan x="155.0" dy="0">WAITING</tspan><tspan x="155.0" dy="24">等准入 / 资源</tspan></text><rect x="385" y="115" width="240" height="88" rx="12" fill="#e8f0f6" stroke="#b6c9d6"/><text x="505.0" y="145" text-anchor="middle" fill="#203b52" font-size="17"><tspan x="505.0" dy="0">RUNNING</tspan><tspan x="505.0" dy="24">活动，但不保证每步入选</tspan></text><rect x="740" y="115" width="270" height="88" rx="12" fill="#e7f1ed" stroke="#b6c9d6"/><text x="875.0" y="145" text-anchor="middle" fill="#203b52" font-size="17"><tspan x="875.0" dy="0">FINISHED_*</tspan><tspan x="875.0" dy="24">完成 / 长度上限 / 取消</tspan></text><rect x="385" y="302" width="240" height="75" rx="12" fill="#fff0df" stroke="#b6c9d6"/><text x="505.0" y="332" text-anchor="middle" fill="#203b52" font-size="17"><tspan x="505.0" dy="0">PREEMPTED</tspan><tspan x="505.0" dy="24">等待恢复与可能重算</tspan></text><path d="M155 115 L155 90 L875 90 L875 115" fill="none" stroke="#456b84" stroke-width="2.3" marker-end="url(#arrow)"/><text x="520" y="77" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="520" dy="0">在 waiting 中也可被取消</tspan></text><path d="M275 156 L385 156" fill="none" stroke="#456b84" stroke-width="2.3" marker-end="url(#arrow)"/><text x="330" y="134" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="330" dy="0">获准调度</tspan></text><path d="M625 156 L740 156" fill="none" stroke="#456b84" stroke-width="2.3" marker-end="url(#arrow)"/><text x="682" y="134" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="682" dy="0">停止或取消</tspan></text><path d="M505 203 L505 302" fill="none" stroke="#456b84" stroke-width="2.3" marker-end="url(#arrow)"/><text x="565" y="259" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="565" dy="0">资源不足等</tspan></text><path d="M385 338 L155 338 L155 203" fill="none" stroke="#456b84" stroke-width="2.3" marker-end="url(#arrow)"/><text x="228" y="317" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="228" dy="0">重新放入 waiting</tspan></text><text x="520" y="421" text-anchor="middle" fill="#203b52" font-size="15"><tspan x="520" dy="0">简化状态图；真实代码还包含 grammar、远程 KV、流式输入等等待状态。</tspan></text></g></svg>